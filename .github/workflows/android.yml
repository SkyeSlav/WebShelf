# Build the WebShelf debug APK on GitHub Actions.
# Versions must match the project: AGP 8.7.3, Kotlin 2.0.21, Gradle 8.9,
# compileSdk/targetSdk 35, JDK 17 (see build.gradle.kts / app/build.gradle.kts).
# Note: this repo ships no gradlew script or gradle-wrapper.jar (the original
# project has only gradle/wrapper/gradle-wrapper.properties), so the build
# uses Gradle 8.9 installed by gradle/actions/setup-gradle instead of
# ./gradlew. Android Studio generates the wrapper files on import.
# How to use: push to main (or run manually from the Actions tab) and
# download the "webshelf-debug-apk" artifact (app-debug.apk) when it goes green.
name: Build WebShelf APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform and build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: webshelf-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
